<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ページタイトルゲッター</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #titleDisplay {
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 20px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <button id="getTitleButton">ページのタイトルを取得</button>
  <div id="titleDisplay"></div>
  <script src="popup.js"></script>
</body>
</html>
