<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ページタイトルゲッター</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #titleDisplay {
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 20px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <h2>Listen テキスト抽出ツール</h2>
  <p>Listenのページでテキストを抽出するには、下のボタンをクリックしてください。</p>
  
  <button id="extractButton">テキストを抽出する</button>
  
  <div id="statusMessage" class="status-message" style="display: none;"></div>
  
  <textarea id="transcriptionDisplay" readonly placeholder="ここに抽出したテキストが表示されます"></textarea>
  
  <script src="popup.js"></script>
</body>
</html>
