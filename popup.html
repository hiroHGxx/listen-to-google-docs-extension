<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Listen テキスト抽出ツール</title>
  <style>
    :root {
      --primary-color: #1a73e8;
      --success-color: #137333;
      --error-color: #c5221f;
      --info-color: #1967d2;
      --bg-color: #ffffff;
      --text-color: #202124;
      --border-color: #dadce0;
      --hover-color: #f1f3f4;
    }
    
    body {
      width: 450px;
      padding: 0;
      margin: 0;
      font-family: 'Segoe UI', 'Noto Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
    }
    
    .container {
      padding: 16px;
    }
    
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
    }
    
    h1 {
      font-size: 16px;
      font-weight: 500;
      margin: 0;
    }
    
    .version {
      font-size: 12px;
      opacity: 0.8;
      margin-left: 8px;
    }
    
    .section {
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    
    .section-title {
      background-color: #f8f9fa;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 1px solid var(--border-color);
    }
    
    .section-content {
      padding: 16px;
    }
    
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 16px;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      margin: 0;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    
    button:hover:not(:disabled) {
      background-color: #1765d1;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    
    button:active:not(:disabled) {
      background-color: #1557b7;
    }
    
    button:disabled {
      background-color: #e8eaed;
      color: #9aa0a6;
      cursor: not-allowed;
    }
    
    .button-icon {
      margin-right: 8px;
      width: 16px;
      height: 16px;
    }
    
    textarea {
      width: 100%;
      min-height: 200px;
      margin: 12px 0 0;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: 'Roboto Mono', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }
    
    .status-message {
      padding: 12px 16px;
      margin: 12px 0 0;
      border-radius: 4px;
      font-size: 13px;
      display: none;
      line-height: 1.4;
    }
    
    .success {
      background-color: #e6f4ea;
      color: var(--success-color);
      border: 1px solid #b7e1cd;
      display: flex;
      align-items: flex-start;
    }
    
    .error {
      background-color: #fce8e6;
      color: var(--error-color);
      border: 1px solid #f5b9b7;
      display: flex;
      align-items: flex-start;
    }
    
    .info {
      background-color: #e8f0fe;
      color: var(--info-color);
      border: 1px solid #bbdefb;
      display: flex;
      align-items: flex-start;
    }
    
    .status-icon {
      margin-right: 8px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    
    .status-content {
      flex-grow: 1;
    }
    
    .instructions {
      font-size: 13px;
      color: #5f6368;
      margin: 12px 0 0;
      line-height: 1.5;
    }
    
    .instructions ol {
      margin: 8px 0;
      padding-left: 24px;
    }
    
    .instructions li {
      margin-bottom: 4px;
    }
    
    footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: #5f6368;
      text-align: center;
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Listen テキスト抽出ツール <span class="version">v1.0.2</span></h1>
  </header>
  
  <div class="container">
    <div class="section">
      <div class="section-title">テキスト抽出</div>
      <div class="section-content">
        <button id="extractButton">
          <svg class="button-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          テキストを抽出する
        </button>
        
        <div id="statusMessage" class="status-message">
          <svg class="status-icon" viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
          </svg>
          <div class="status-content"></div>
        </div>
        
        <div class="instructions">
          <p><strong>使い方:</strong></p>
          <ol>
            <li>Listenの記事ページでこの拡張機能を開く</li>
            <li>「テキストを抽出する」ボタンをクリック</li>
            <li>抽出されたテキストが自動でコピーされ、下のボックスに表示されます</li>
          </ol>
        </div>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">抽出されたテキスト</div>
      <div class="section-content">
        <textarea 
          id="transcriptionDisplay" 
          placeholder="ここに抽出されたテキストが表示されます"
          readonly
        ></textarea>
      </div>
    </div>
    
    <footer>
      <p> 2023 Listen </p>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
